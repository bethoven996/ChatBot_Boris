name: Keep Boris despierto

on:
  schedule:
    # Cada 6 horas. Streamlit duerme apps sin visitas ~12hs, así que
    # con este intervalo nunca llega a dormirse.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # permite tocar "Run workflow" a mano para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Despertar la app
        run: python keep_alive.py
        env:
          APP_URL: https://chatbotborisgit-txsap7uqcdfdunwmeo9ppi.streamlit.app/

      - name: Subir captura si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error.png
          if-no-files-found: ignore
